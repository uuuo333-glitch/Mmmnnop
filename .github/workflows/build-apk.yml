name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode AI Studio debug keystore
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Copy APK for download
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/matjar-store.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: matjar-store-apk
          path: dist-apk/matjar-store.apk

      - name: Publish Direct Download Release
        if: startsWith(github.ref, 'refs/heads/')
        permissions:
          contents: write
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: متجر واتس — أحدث نسخة APK جاهزة للتحميل
          files: dist-apk/matjar-store.apk
          prerelease: false
          make_latest: true
